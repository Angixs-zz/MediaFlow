<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediaFlow · Descargas personales</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eef0f9;background:#0c1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#26326c 0%,#0c1020 65%)}header{max-width:1040px;margin:auto;padding:28px 20px;font-size:20px;font-weight:800}.logo{color:#8ca2ff}main{max-width:680px;margin:8vh auto;padding:0 20px}h1{font-size:clamp(32px,6vw,50px);letter-spacing:-2px;line-height:1.1;text-align:center;margin-bottom:14px}p.sub{text-align:center;color:#aab2cb;line-height:1.6;margin-bottom:42px}.panel{background:#181e35;border:1px solid #39415c;border-radius:20px;padding:28px;box-shadow:0 18px 80px #060b1c70}label{display:block;font-size:13px;color:#c6cde4;margin-bottom:9px;font-weight:650}input,select{width:100%;background:#0d1429;color:white;border:1px solid #465174;border-radius:10px;padding:14px;font:inherit;outline:none}input:focus,select:focus{border-color:#879cff}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}button{width:100%;border:0;background:#7c92ff;color:#09112b;font-size:16px;font-weight:800;padding:15px;border-radius:11px;margin-top:25px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:24px;color:#d3dcff;display:none}.bar{width:100%;height:9px;background:#303b5a;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#86a0ff;transition:width .3s}a.download{display:inline-block;color:#c3d0ff;margin-top:12px}footer{text-align:center;color:#909ab8;margin:35px auto;font-size:13px;line-height:1.6}@media(max-width:500px){main{margin:35px auto}.panel{padding:20px}.two{grid-template-columns:1fr}}
</style>
</head>
<body><header><span class="logo">◉</span> MediaFlow</header><main><h1>Tu contenido, a tu alcance.</h1><p class="sub">Descarga contenido que tengas derecho a guardar, con una interfaz sencilla y sin comandos.</p><section class="panel"><form id="form"><label for="url">Enlace de YouTube</label><input required type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"><div class="two"><div><label for="mode">Formato</label><select id="mode"><option value="video">Video</option><option value="audio">Audio MP3</option></select></div><div><label for="quality">Calidad máxima</label><select id="quality"><option value="best">Mejor disponible</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select></div></div><button id="submit" type="submit">↓ Preparar descarga</button></form><div class="status" id="status"><div id="message">Preparando…</div><div class="bar"><div id="fill" class="fill"></div></div><a id="link" class="download" style="display:none">Guardar archivo ↓</a></div></section><footer>Funciona con yt-dlp y FFmpeg en tu equipo. Solo para contenido autorizado.<br>Versión local · 0.1</footer></main><script>
const form=document.querySelector('#form'),btn=document.querySelector('#submit'),statusBox=document.querySelector('#status'),message=document.querySelector('#message'),fill=document.querySelector('#fill'),link=document.querySelector('#link');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;statusBox.style.display='block';link.style.display='none';fill.style.width='0%';message.textContent='Creando descarga…';try{const response=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value.trim(),mode:document.querySelector('#mode').value,quality:document.querySelector('#quality').value})});const data=await response.json();if(!response.ok)throw Error(data.detail||'No se pudo iniciar');while(true){await sleep(1100);const res=await fetch(`/api/jobs/${data.job_id}`);if(!res.ok)throw Error('No se pudo consultar el progreso');const job=await res.json();fill.style.width=`${job.progress||0}%`;message.textContent=({queued:'En cola',downloading:'Descargando',processing:'Procesando',completed:'¡Descarga lista!',failed:'Error'})[job.status]+` · ${Math.round(job.progress||0)}%`;if(job.status==='completed'){link.href=`/api/files/${data.job_id}`;link.style.display='inline-block';break}if(job.status==='failed')throw Error(job.error||'Error desconocido')}}catch(err){message.textContent=`No fue posible completar: ${err.message}`}finally{btn.disabled=false}});
</script></body></html>
